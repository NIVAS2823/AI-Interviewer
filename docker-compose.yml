version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-interviewer-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb
      - redis
    networks:
      - ai-net
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  agent_worker:
    build:
      context: ./backend/worker   # ✅ FIXED
      dockerfile: Dockerfile
    container_name: ai-agent-worker
    ports:
      - "9000:9000"

    # load all API keys from backend .env
    env_file:
      - ./backend/.env

    networks:
      - ai-net
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-interviewer-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ai-net
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173

  mongodb:
    image: mongo:7.0
    container_name: ai-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_interviewer
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ai-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-net
    restart: unless-stopped
    command: redis-server --appendonly yes

networks:
  ai-net:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  backend_uploads:
