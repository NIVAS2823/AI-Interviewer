version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-interviewer-backend
    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      VIDEOSDK_API_KEY: ${VIDEOSDK_API_KEY}
      VIDEOSDK_DEPLOYMENT_ID: ${VIDEOSDK_DEPLOYMENT_ID}
      GROQ_API_KEY: ${GROQ_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      GOOGLE_TTS_CREDENTIALS: /app/config/google-tts.json

    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - ./backend/app/config/google-tts.json:/app/config/google-tts.json:ro

    depends_on:
      - mongodb
      - redis

    networks:
      - ai-interviewer-network

    restart: unless-stopped

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-interviewer-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ai-interviewer-network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173

  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: ai-interviewer-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ai_interviewer
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ai-interviewer-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: ai-interviewer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-interviewer-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  ai-interviewer-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
